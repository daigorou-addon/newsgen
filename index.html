<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">ニュース風ジェネレーター — NewsGen</title>
<link rel="icon" type="image/png" href="favicon.png">
<script>
  (function(){
    try{
      var t = localStorage.getItem('newsgen-theme');
      document.documentElement.setAttribute('data-theme', (t === 'light') ? 'light' : 'dark');
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+1p:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;700;900&family=BIZ+UDPGothic:wght@400;700&family=Kosugi+Maru&family=Kiwi+Maru:wght@400;500&family=Zen+Old+Mincho:wght@400;700;900&family=Zen+Antique&family=Klee+One:wght@400;600&family=Yuji+Syuku&family=Dela+Gothic+One&family=RocknRoll+One&family=Reggae+One&family=Rampart+One&family=Stick&family=Potta+One&family=Mochiy+Pop+One&family=Hachi+Maru+Pop&family=Darumadrop+One&family=Yusei+Magic&family=Yomogi&family=Train+One&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="local-badge" data-i18n="local_badge">local-only</span>
    <span class="brand-name">ニュース風ジェネレーター</span>
    <a href="https://daigorou-addon.github.io/daigorou-tools/" class="back-link" data-i18n="back_to_top">← Daigorou-Tools</a>
  </div>
  <div class="toolbar">
    <select id="ratioSelect" class="ratio-select">
      <option value="16:9">16:9 (1280×720)</option>
      <option value="1:1">1:1 (1080×1080)</option>
      <option value="4:5">4:5 (1080×1350)</option>
      <option value="9:16">9:16 (1080×1920)</option>
    </select>
    <button id="downloadBtn" class="primary" data-i18n="download_btn">画像を保存</button>
    <div class="history-btns">
      <button id="undoBtn" class="ghost small" data-i18n-title="undo_title" title="元に戻す">↶</button>
      <button id="redoBtn" class="ghost small" data-i18n-title="redo_title" title="やり直す">↷</button>
    </div>
    <button id="themeToggleBtn" class="theme-toggle" data-i18n-title="theme_toggle_title" title="表示テーマを切り替え">☀</button>
    <select id="langSelect" class="lang-select">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="es">Español</option>
    </select>
  </div>
</header>

<main>
  <aside class="col-tools" id="propPanel">

    <section class="panel-block props-block">
      <h2 data-i18n="prop_heading">選択中の要素</h2>
      <div id="propEmpty" class="hint" data-i18n="prop_empty">キャンバス上の要素をクリックして選択してください</div>

      <div id="propText" class="prop-group" style="display:none;">
        <div class="field">
          <label data-i18n="prop_font">フォント</label>
          <select id="propFontFamily">
            <option value="sans" data-i18n="font_sans">ゴシック</option>
            <option value="serif" data-i18n="font_serif">明朝</option>
            <option value="mono" data-i18n="font_mono">モノスペース</option>
            <option value="notosans">Noto Sans JP</option>
            <option value="mplus1p">M PLUS 1p</option>
            <option value="mplusround">M PLUS Rounded 1c（丸ゴシック）</option>
            <option value="zenmaru">Zen 丸ゴシック</option>
            <option value="bizudp">BIZ UDPゴシック</option>
            <option value="kosugimaru">小杉丸ゴシック</option>
            <option value="kiwimaru">キウイ丸</option>
            <option value="zenoldmin">Zen オールド明朝</option>
            <option value="zenantique">Zen アンティーク</option>
            <option value="kleeone">クレー One（手書き風）</option>
            <option value="yujisyuku">游字 粛（筆書体）</option>
            <option value="dela">デラゴシック One（極太）</option>
            <option value="rocknroll">ロックンロール One</option>
            <option value="reggae">レゲエ One</option>
            <option value="rampart">ランパート One（立体）</option>
            <option value="stick">スティック（ロボット風）</option>
            <option value="potta">ポッタ One（ポップ）</option>
            <option value="mochiy">モーチィ ポップ One</option>
            <option value="hachimaru">はちまるポップ</option>
            <option value="darumadrop">だるまドロップ One</option>
            <option value="yusei">油性マジック</option>
            <option value="yomogi">よもぎ（手書き）</option>
            <option value="trainone">トレイン One</option>
            <option value="dotgothic">ドットゴシック16</option>
          </select>
        </div>
        <div class="row2">
          <div class="field">
            <label data-i18n="prop_size">文字サイズ</label>
            <input type="number" id="propFontSize" min="8" max="300" step="1">
          </div>
          <div class="field">
            <label data-i18n="prop_weight">太さ</label>
            <select id="propWeight">
              <option value="400" data-i18n="weight_normal">標準</option>
              <option value="700" data-i18n="weight_bold">太字</option>
              <option value="900" data-i18n="weight_black">極太</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label data-i18n="prop_color">文字色</label>
            <input type="color" id="propColor">
          </div>
          <div class="field">
            <label data-i18n="prop_align">配置</label>
            <select id="propAlign">
              <option value="left" data-i18n="align_left">左</option>
              <option value="center" data-i18n="align_center">中央</option>
              <option value="right" data-i18n="align_right">右</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label data-i18n="prop_frame_shape">枠の形</label>
          <select id="propFrameShape">
            <option value="none" data-i18n="frame_none">なし</option>
            <option value="rect" data-i18n="frame_rect">四角</option>
            <option value="rounded" data-i18n="frame_rounded">角丸</option>
            <option value="pill" data-i18n="frame_pill">ピル型</option>
            <option value="circle" data-i18n="frame_circle">丸（円形）</option>
            <option value="parallelogram-right" data-i18n="frame_para_r">平行四辺形（右）</option>
            <option value="parallelogram-left" data-i18n="frame_para_l">平行四辺形（左）</option>
            <option value="diagonal" data-i18n="frame_diagonal">両斜めカット</option>
            <option value="ribbon" data-i18n="frame_ribbon">リボン（旗型）</option>
            <option value="underline" data-i18n="frame_underline">下線バー</option>
          </select>
        </div>
        <div class="row2">
          <div class="field">
            <label data-i18n="prop_frame_color">枠の色</label>
            <input type="color" id="propFrameColor">
          </div>
          <div class="field">
            <label data-i18n="prop_frame_opacity">不透明度</label>
            <input type="range" id="propFrameOpacity" min="0" max="100" step="1">
          </div>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="propBorder">
          <span data-i18n="prop_border">外枠線をつける</span>
        </label>
        <div class="row2">
          <div class="field" id="propBorderColorField">
            <label data-i18n="prop_border_color">外枠線の色</label>
            <input type="color" id="propBorderColor" value="#141414">
          </div>
          <div class="field" id="propBorderWidthField">
            <label data-i18n="prop_border_width">外枠線の太さ</label>
            <input type="range" id="propBorderWidth" min="1" max="30" step="1" value="4">
          </div>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="propOutline">
          <span data-i18n="prop_outline">文字に縁取り（字幕風）</span>
        </label>
      </div>

      <div id="propImage" class="prop-group" style="display:none;">
        <div class="add-row">
          <button class="ghost small" id="propImgFront" data-i18n="prop_bring_front">前面へ</button>
          <button class="ghost small" id="propImgBack" data-i18n="prop_send_back">背面へ</button>
        </div>
      </div>

      <div id="propWipe" class="prop-group" style="display:none;">
        <div class="field">
          <label data-i18n="prop_wipe_shape">ワイプの形</label>
          <select id="propWipeShape">
            <option value="circle" data-i18n="wipe_circle">◯ 丸</option>
            <option value="square" data-i18n="wipe_square">□ 四角</option>
          </select>
        </div>
        <div class="row2">
          <div class="field">
            <label data-i18n="prop_frame_color">枠の色</label>
            <input type="color" id="propWipeColor" value="#ffffff">
          </div>
          <div class="field">
            <label data-i18n="prop_border_width">枠の太さ</label>
            <input type="range" id="propWipeWidth" min="0" max="30" step="1" value="3">
          </div>
        </div>
        <p class="hint" data-i18n="wipe_hint">画像をドラッグ&ドロップで挿入。挿入後はドラッグで中の画像を移動できます</p>
      </div>

      <button class="ghost small danger" id="propDeleteBtn" style="display:none;" data-i18n="prop_delete">この要素を削除</button>
    </section>

    <section class="panel-block">
      <h2 class="panel-h2" data-collapse-target="tplBody"><span data-i18n="tpl_heading">テンプレート</span><span class="chev">▾</span></h2>
      <div class="panel-body" id="tplBody">
      <div class="template-grid" id="templateGrid"></div>
      </div>
    </section>

  </aside>

  <aside class="col-props">
    <section class="panel-block layers-block">
      <h2 data-i18n="layers_heading">レイヤー</h2>
      <div class="layer-list" id="layerList"></div>
      <p class="hint" id="layerEmpty" data-i18n="layers_empty">要素を追加するとここに表示されます</p>
    </section>
  </aside>

  <div class="stage-area">
    <div class="canvas-col">
      <div class="add-bar">
        <button class="ghost" id="addTextBtn" data-i18n="add_text_btn">＋ テキスト</button>
        <button class="ghost" id="addFrameBtn" data-i18n="add_frame_btn">＋ 図形/枠</button>
        <button class="ghost" id="addImageBtn" data-i18n="add_image_btn">＋ 画像</button>
        <button class="ghost" id="addWipeBtn" data-i18n="add_wipe_btn">＋ ワイプ</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <span class="add-bar-sep"></span>
        <label class="checkbox-row inline">
          <input type="checkbox" id="toggleTime">
          <span data-i18n="toggle_time">時刻を表示</span>
        </label>
        <label class="checkbox-row inline">
          <input type="checkbox" id="toggleWeather">
          <span data-i18n="toggle_weather">天気を表示</span>
        </label>
      </div>
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage"></div>
        <div class="selection-overlay" id="selectionOverlay">
          <div class="sel-frame" id="selFrame" style="display:none;">
            <div class="resize-handle nw" data-handle="nw"></div>
            <div class="resize-handle ne" data-handle="ne"></div>
            <div class="resize-handle sw" data-handle="sw"></div>
            <div class="resize-handle se" data-handle="se"></div>
            <div class="delete-handle" id="selDeleteHandle" data-i18n-title="prop_delete" title="この要素を削除">×</div>
            <div class="move-handle" id="selMoveHandle" data-i18n-title="prop_move_frame" title="枠を移動">✥</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<a id="dlLink" class="dl" download></a>
<footer>
  <div data-i18n="footer_privacy_note">すべての処理はこの端末内で行われます。ファイルはどこにも送信されません。</div>
  <div class="footer-copyright">Copyright (C) 2026 daigorou-tools. All rights reserved.</div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
